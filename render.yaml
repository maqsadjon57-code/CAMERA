# ============================================================================
#  AI HUD — деплой на Render (бесплатный тариф) — телефон подключается
#  по HTTPS-ссылке БЕЗ Termux и без своего компьютера.
#
#  Как развернуть (5 минут, всё в браузере, можно с телефона):
#    1. Зарегистрируйтесь на https://render.com (Sign in with GitHub).
#    2. Dashboard → New + → Web Service.
#    3. Подключите репозиторий maqsadjon57-code/arbitrage-win-rate-90-
#       и выберите ветку  arena/01a031d0-arbitrage-win-rate-90
#       (Render сам прочитает этот render.yaml).
#    4. Дождитесь сборки и откройте выданный адрес https://ai-hud-....onrender.com
#       на телефоне → «Разрешить доступ к камере» — HTTPS уже есть,
#       камера устройства работает сразу.
#
#  На бесплатном тарифе сервер «засыпает» через 15 минут без обращений —
#  просто откройте страницу заново. Детекция людей — встроенным HOG OpenCV.
# ============================================================================
services:
  - type: web
    name: ai-hud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-phone.txt
    startCommand: python app.py --host 0.0.0.0 --port $PORT --input synth --max-fps 15
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
